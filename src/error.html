<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
			rel="stylesheet"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Guess One Piece characters daily!" />
		<meta name="og:title" content="Grandlinedle" />
		<meta name="og:description" content="Guess One Piece characters daily!" />
		<meta name="og:image" content="https://grandlinedle.com/meta-logo-v2.png" />
		<link rel="stylesheet" href="app.css" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5" />
		<meta name="msapplication-TileColor" content="#da532c" />
		<meta name="theme-color" content="#ffffff" />
		<title>Grandlinedle - Error</title>
	</head>
	<body
		data-sveltekit-preload-data="hover"
		style="
			background-image: url('/src/lib/assets/one-piece-bg.webp');
			background-size: cover;
			background-repeat: no-repeat;
			background-position: center;
			overflow: hidden;
			min-height: 100dvh;
			font-family: DM sans;
		"
	>
		<div style="display: contents">
			<main style="min-height: 100dvh; height: 100dvh">
				<div
					style="
						display: flex;
						flex-direction: column;
						align-items: center;
						max-width: 768px;
						margin-inline: auto;
					"
				>
					<img
						alt="The grandlinedle logo"
						src="/src/lib/assets/grandlinedle-logo.png"
						style="max-width: 384px; width: 100%; margin-block: 16px"
					/>
					<p
						style="
							text-align: center;
							font-weight: 700;
							font-size: 36px;
							color: #fff;
							line-height: calc(2.5 / 2.25);
							margin: 0;
							text-shadow:
								0px 1px 0px #000,
								0px 1px 1px #000,
								0px 2px 2px #000;
							padding-inline: 16px;
						"
					>
						%sveltekit.error.message%
					</p>
				</div>
			</main>
		</div>
	</body>
</html>
